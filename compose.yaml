services:
  db:
    image: postgres:17
    container_name: funandchecks-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Собственный почтовый сервер (send-only). Письма с подтверждением/сбросом
  # пароля уходят через него — без внешних сервисов и лимитов.
  mail:
    image: boky/postfix:latest
    container_name: funandchecks-mail
    restart: always
    environment:
      # Домен, от чьего имени разрешена отправка (должен совпадать с Smtp__FromEmail).
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN}
      HOSTNAME: mail.${MAIL_DOMAIN}
      # Автогенерация DKIM-ключа (публичную часть нужно добавить в DNS — см. DEPLOY.md).
      DKIM_AUTOGENERATE: "1"
    volumes:
      - maildkim:/etc/opendkim/keys
    expose:
      - "587"

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - funandchecks-api
    networks:
      - default
      - caddy_net

  # Разовая подготовка прав существующих томов после перехода API с root на app.
  app-volume-init:
    image: funandchecks-api
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R app:app /app/backups /app/media-temp /home/app/.aspnet/DataProtection-Keys && chmod 700 /app/media-temp /home/app/.aspnet/DataProtection-Keys"]
    volumes:
      - backups:/app/backups
      - media-temp:/app/media-temp
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

  funandchecks-api:
    container_name: funandchecks-api
    image: funandchecks-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    user: app
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      app-volume-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:${API_INTERNAL_PORT}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      # Почта: отправляем через контейнер mail по внутренней сети (без TLS/авторизации).
      - Smtp__Host=mail
      - Smtp__Port=587
      - Smtp__UseStartTls=false
      - Smtp__FromEmail=noreply@${MAIL_DOMAIN}
      - Smtp__FromName=FunAndChecks
      # Каталог бэкапов внутри контейнера (смонтирован на том backups).
      - Backup__Directory=/app/backups
      # Только временные исходники редактора; готовые аватары и значки хранятся в БД.
      - ProfileMedia__TemporaryDirectory=/app/media-temp
      # Разрешённые источники для CORS в проде (через запятую отображаются как массив).
      - Cors__AllowedOrigins__0=https://${APP_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_INTERNAL_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "${API_INTERNAL_PORT}"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      # Секреты приложения (как минимум InitialAdmins). Создаётся из secrets.template.json.
      - ./secrets.json:/app/secrets.json:ro
      # Том для дампов БД (ручка POST /api/admin/backup).
      - backups:/app/backups
      - media-temp:/app/media-temp


volumes:
  pgdata:
  dataprotection-keys:
  caddy_data:
  caddy_config:
  maildkim:
  backups:
  media-temp:


networks:
  caddy_net:
    external: true
